name: staynaija_shared
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: any
  web_socket_channel: any
  flutter_secure_storage: any
  intl: any
  google_fonts: any
  cached_network_image: ^4.0.0
  flutter_map: ^8.3.2
  flutter_map_cache: ^2.1.0
  dio_cache_interceptor: ^4.0.7
  http_cache_file_store: ^2.0.2
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.1
  lucide_icons_flutter: ^3.1.20
  # Material's RefreshIndicator only exposes colour and stroke width, which is
  # not enough to draw our own loader. Pure Dart, so no native build step.
  custom_refresh_indicator: ^4.0.1
  # Social sign-in SDKs, wrapped by SocialAuthService so both apps share one
  # implementation. Each needs real provider credentials configured in the
  # app that uses it (Android/iOS project files) before it will do anything
  # but return the provider's own "not configured" error - see that file's
  # doc comment for exactly what each one needs.
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_facebook_auth: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
