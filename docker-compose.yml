services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: staynaija
      POSTGRES_PASSWORD: staynaija
      POSTGRES_DB: staynaija
    ports:
      - "5433:5432"
    volumes:
      - staynaija_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staynaija"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://staynaija:staynaija@db:5432/staynaija
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # No command override - the image's own CMD runs migrations then starts
    # the server, so local dev and production (Magic Containers) behave the
    # same way. See backend/Dockerfile.

volumes:
  staynaija_pgdata:
