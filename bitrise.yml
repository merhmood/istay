format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# Two Flutter apps live in one repo (guest_app/, host_app/), each with an iOS
# and an Android workflow below (four total). staynaija_shared is pulled in
# via a local path dependency (`path: ../staynaija_shared`), which resolves
# correctly as-is once the whole repo is checked out - no extra step needed
# for it.
#
# The iOS workflows build a signed .ipa; Android builds a release .apk. Both
# upload to Bitrise.io as an installable artifact (development/ad-hoc
# distribution for iOS, direct install for Android) - neither goes through
# the App Store/Play Store, so either lands straight on a test device. See
# ios/ExportOptions.plist in each app for the one-time iOS signing setup.
#
# API_BASE_URL is read from a Bitrise Secret (Workflow Editor -> Secrets tab
# on this app - NOT the GitHub repo's secrets, which Bitrise has no access
# to) and passed through as a Dart define on all four workflows - see
# ApiConfig.baseUrl in staynaija_shared.
#
# Deliberately NOT declared under a workflow `envs:` block here: Bitrise
# resolves workflow-level envs *after* Secrets, so a value set here would
# always beat the Secret instead of falling back to it. The script below
# defaults to localhost with a plain bash `${VAR:-default}` instead, which
# doesn't participate in that ordering.
#
# Stack/machine: the app-level default at the bottom (osx-xcode) is needed
# for the two iOS workflows only - Xcode requires a Mac, which Bitrise gates
# behind a paid plan regardless of this file. The two Android workflows each
# override it to a Linux stack (see their own `meta:` blocks) since they
# don't touch Xcode at all, and that Linux tier runs on the free/trial plan.

workflows:
  deploy_guest_ios:
    envs:
      - APP_DIR: guest_app
    steps:
      - git-clone@8: {}
      - flutter-installer@0:
          inputs:
            - version: stable
      - script@1:
          title: flutter pub get
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                flutter pub get
      - certificate-and-profile-installer@1: {}
      - script@1:
          title: flutter build ipa
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                : "${API_BASE_URL:=http://localhost:8000}"
                echo "Building against API_BASE_URL=$API_BASE_URL"
                flutter build ipa --release \
                  --export-options-plist=ios/ExportOptions.plist \
                  --dart-define=API_BASE_URL="$API_BASE_URL"
      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: $APP_DIR/build/ios/ipa

  deploy_host_ios:
    envs:
      - APP_DIR: host_app
    steps:
      - git-clone@8: {}
      - flutter-installer@0:
          inputs:
            - version: stable
      - script@1:
          title: flutter pub get
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                flutter pub get
      - certificate-and-profile-installer@1: {}
      - script@1:
          title: flutter build ipa
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                : "${API_BASE_URL:=http://localhost:8000}"
                echo "Building against API_BASE_URL=$API_BASE_URL"
                flutter build ipa --release \
                  --export-options-plist=ios/ExportOptions.plist \
                  --dart-define=API_BASE_URL="$API_BASE_URL"
      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: $APP_DIR/build/ios/ipa

  # Android release APKs, same API_BASE_URL Secret as the iOS workflows above.
  # No code-signing step needed here the way iOS needs certificates: both
  # apps' android/app/build.gradle.kts still point the release build type at
  # the debug signing config (see the TODO already there) - same as every
  # Android build this project has installed for testing so far, just run on
  # Bitrise instead of locally. Swap that gradle config for a real release
  # keystore before this ever needs to go to the Play Store.
  deploy_guest_android:
    envs:
      - APP_DIR: guest_app
    # Overrides the app-level macOS/Xcode stack at the bottom of this file -
    # Android needs neither Xcode nor a Mac, and Mac machines are gated
    # behind a paid Bitrise plan. This Linux stack runs on the free/trial tier.
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: standard
    steps:
      - git-clone@8: {}
      - flutter-installer@0:
          inputs:
            - version: stable
      - script@1:
          title: flutter pub get
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                flutter pub get
      - script@1:
          title: flutter build apk
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                : "${API_BASE_URL:=http://localhost:8000}"
                echo "Building against API_BASE_URL=$API_BASE_URL"
                flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: $APP_DIR/build/app/outputs/flutter-apk

  deploy_host_android:
    envs:
      - APP_DIR: host_app
    # See deploy_guest_android above - same Linux stack override, same reason.
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: standard
    steps:
      - git-clone@8: {}
      - flutter-installer@0:
          inputs:
            - version: stable
      - script@1:
          title: flutter pub get
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                flutter pub get
      - script@1:
          title: flutter build apk
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$APP_DIR"
                : "${API_BASE_URL:=http://localhost:8000}"
                echo "Building against API_BASE_URL=$API_BASE_URL"
                flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: $APP_DIR/build/app/outputs/flutter-apk

# No app-level default stack/machine here on purpose: a macOS default (needed
# for deploy_guest_ios/deploy_host_ios) gets validated against the account's
# available machines the moment bitrise.yml is accepted as the git-stored
# config - on an account with no Mac access yet, that rejects the whole file,
# blocking even the two Android workflows below, which don't need a Mac at
# all and already set their own linux-docker-android-22.04 stack explicitly.
# Once this Bitrise account has Mac machine access, restore this block (or
# add the same two lines directly under each iOS workflow's own `meta:`,
# matching the Android workflows' pattern) so deploy_guest_ios/deploy_host_ios
# have a stack to build on:
#   stack: osx-xcode-15.4.x
#   machine_type_id: g2-m1.4core
