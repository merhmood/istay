name: Deploy backend to Magic Containers

# Monorepo guard: this only fires when something under backend/ (or this
# workflow itself) actually changes - a guest_app/host_app-only commit
# shouldn't rebuild and redeploy the API.
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/GHCR repository paths must be lowercase; github.repository
      # isn't (the org is "Stay-Naijaa") - a straight interpolation of it into
      # the tag below fails at build time with "repository name must be
      # lowercase". GitHub Actions expressions have no built-in lower(), so
      # do it in bash instead.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}

      # Prerequisite: an app must already exist on Magic Containers (created
      # once, by hand, via the Bunny dashboard) before this can roll it -
      # see docs/deploy-backend.md for that one-time setup.
      - name: Roll out on Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNY_API_KEY }}
          container: api
          image_tag: "${{ github.sha }}"
