name: Deploy backend to Magic Containers

# Monorepo guard: this only fires when something under backend/ (or this
# workflow itself) actually changes - a guest_app/host_app-only commit
# shouldn't rebuild and redeploy the API.
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/GHCR repository paths must be lowercase; github.repository
      # isn't (the org is "Stay-Naijaa") - a straight interpolation of it into
      # the tag below fails at build time with "repository name must be
      # lowercase". GitHub Actions expressions have no built-in lower(), so
      # do it in bash instead.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}

      # Prerequisite: an app must already exist on Magic Containers (created
      # once, by hand, via the Bunny dashboard) before this can roll it -
      # see docs/deploy-backend.md for that one-time setup.
      # Same two calls BunnyWay/actions/container-update-image makes, done by
      # hand because that action swallows the response body: when the PATCH
      # failed with a bare "HTTP status 404" there was no way to tell why. This
      # prints the container's current image settings (no env vars/secrets) and
      # Bunny's actual error message.
      - name: Roll out on Magic Containers
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_APP_ID: ${{ vars.BUNNY_APP_ID }}
          CONTAINER_NAME: staynaija-backend
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAMESPACE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          app=$(curl -sS -f -H "AccessKey: $BUNNY_API_KEY" -H "Accept: application/json" \
            "https://api.bunny.net/mc/apps/$BUNNY_APP_ID")
          container_id=$(echo "$app" | jq -r --arg n "$CONTAINER_NAME" '.containerTemplates[] | select(.name == $n) | .id')
          if [ -z "$container_id" ]; then
            echo "No container named $CONTAINER_NAME. Containers in this app:"
            echo "$app" | jq -r '.containerTemplates[].name'
            exit 1
          fi
          echo "Current image settings for $container_id:"
          echo "$app" | jq --arg n "$CONTAINER_NAME" '.containerTemplates[] | select(.name == $n) | {imageRegistryId, imageNamespace, imageName, imageTag, imageDigest}'
          # Send the whole image identity, not just the tag: the repo moved owners
          # (stay-naijaa/staynaija-backend -> <owner>/<repo>-backend), and the
          # container also pins an image digest that must follow the new image.
          namespace=$(echo "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')
          name="${IMAGE_REPO##*/}"
          body=$(jq -n --arg id "$container_id" --arg tag "$IMAGE_TAG" --arg digest "$IMAGE_DIGEST" \
            --arg ns "$namespace" --arg name "$name" \
            '{id: $id, imageNamespace: $ns, imageName: $name, imageTag: $tag, imageDigest: $digest}')
          echo "Rolling out $namespace/$name:$IMAGE_TAG ($IMAGE_DIGEST)"
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            -H "AccessKey: $BUNNY_API_KEY" -H "Content-Type: application/json" \
            -d "$body" \
            "https://api.bunny.net/mc/apps/$BUNNY_APP_ID/containers/$container_id")
          echo "PATCH status: $status"
          cat response.json; echo
          [ "$status" = "200" ]
